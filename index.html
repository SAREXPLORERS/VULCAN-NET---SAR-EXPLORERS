<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VULCAN NET - Visualización SAR Perú</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background-color: #f9fafb;
      color: #222;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid #ddd;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: bold;
    }

    iframe {
      width: 100%;
      height: 100vh;
      border: none;
    }

    .button {
      border: 1px solid #aaa;
      background: white;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }
    .button:hover {
      background: #f3f4f6;
    }

    .sidebar, .sar-panel {
      position: fixed;
      top: 80px;
      width: 350px;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      backdrop-filter: blur(6px);
      z-index: 1000;
    }

    .sidebar {
      left: 10px;
    }

    .sar-panel {
      right: 10px;
    }

    .volcano-card {
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      background: white;
    }

    .volcano-card:hover {
      background: #f8f9fa;
    }

    .volcano-details {
      margin-top: 8px;
      font-size: 13px;
      border-top: 1px solid #ddd;
      padding-top: 6px;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      color: white;
    }

    .muy-alto { background: #dc2626; }
    .alto { background: #ea580c; }
    .moderado { background: #eab308; color: black; }

    .hidden { display: none; }

  </style>
</head>
<body>

  <header>
    <div>
      <h1>VULCAN NET</h1>
      <p style="font-size: 12px; color: gray;">9 volcanes activos | Visualización SAR - Perú</p>
    </div>
    <div>
      <button class="button" id="toggleVolcanes">Volcanes</button>
      <button class="button" id="toggleSAR">Interpretación SAR</button>
      <button class="button" onclick="window.open('https://e-caldron-473502-i8.projects.earthengine.app/view/version-final')">Abrir en GEE</button>
    </div>
  </header>

  <iframe src="https://e-caldron-473502-i8.projects.earthengine.app/view/version-final"></iframe>

  <!-- Sidebar Volcanes -->
  <div class="sidebar" id="sidebarVolcanes"></div>

  <!-- Panel SAR -->
  <div class="sar-panel hidden" id="sarPanel"></div>

  <script>
    const volcanoes = [
      { name: "Ubinas", color: "#e6194b", risk: "Muy Alto", elevation: "5672 m", last: "2023 (activo)", hazards: ["Flujos piroclásticos", "Caída de ceniza", "Lahares"], pop: "~3,000 personas" },
      { name: "Sabancaya", color: "#3cb44b", risk: "Muy Alto", elevation: "5976 m", last: "2019-2022", hazards: ["Domos de lava", "Explosiones", "Caída de ceniza"], pop: "Valle del Colca" },
      { name: "Misti", color: "#ffe119", risk: "Muy Alto", elevation: "5822 m", last: "1985", hazards: ["Flujos piroclásticos", "Lahares"], pop: "~1 millón (Arequipa)" },
      { name: "Ticsani", color: "#4363d8", risk: "Alto", elevation: "5408 m", last: "Holoceno", hazards: ["Flujos de lava"], pop: "Comunidades rurales" },
      { name: "Huaynaputina", color: "#f58231", risk: "Alto", elevation: "4850 m", last: "1600", hazards: ["Lahares", "Caída de ceniza"], pop: "Zona rural de Moquegua" },
      { name: "Coropuna", color: "#911eb4", risk: "Alto", elevation: "6377 m", last: "Holoceno", hazards: ["Lahares glaciares"], pop: "Valles agrícolas" },
      { name: "Tutupaca", color: "#46f0f0", risk: "Alto", elevation: "5815 m", last: "Holoceno", hazards: ["Flujos de lava"], pop: "Frontera Perú-Chile" },
      { name: "SaraSara", color: "#f032e6", risk: "Moderado", elevation: "5505 m", last: "Pleistoceno-Holoceno", hazards: ["Lahares"], pop: "Zona rural de Ayacucho" },
      { name: "Yucamana", color: "#bcf60c", risk: "Moderado", elevation: "5550 m", last: "Holoceno", hazards: ["Flujos de lava"], pop: "Comunidades de Tacna" },
    ];

    const sarInterpretations = [
      { title: "Sentinel-1 (VV-VH)", desc: "Blanco = rugoso, Negro = liso", app: "Identifica flujos de lava o humedad." },
      { title: "Sentinel-1 (VV)", desc: "Zonas claras = rugosas", app: "Estudia relieve y erosión." },
      { title: "Sentinel-1 (VH)", desc: "Blanco = humedad alta", app: "Detecta humedad o vegetación." },
      { title: "VV/VH Ratio", desc: "Claro = seco, Oscuro = húmedo", app: "Resalta zonas volcánicas." },
      { title: "PALSAR Ratio", desc: "Verde oscuro = vegetación densa", app: "Distingue cobertura vegetal." },
      { title: "PALSAR Falso Color", desc: "Verde claro = seco", app: "Diferencia zonas áridas vs húmedas." }
    ];

    // Mostrar volcanes
    const sidebar = document.getElementById('sidebarVolcanes');
    volcanoes.forEach(v => {
      const div = document.createElement('div');
      div.className = 'volcano-card';
      div.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span><b>${v.name}</b> (${v.elevation})</span>
          <span class="badge ${v.risk === 'Muy Alto' ? 'muy-alto' : v.risk === 'Alto' ? 'alto' : 'moderado'}">${v.risk}</span>
        </div>
        <div class="volcano-details hidden">
          <p><b>Última actividad:</b> ${v.last}</p>
          <p><b>Peligros:</b> ${v.hazards.join(', ')}</p>
          <p><b>Población expuesta:</b> ${v.pop}</p>
        </div>
      `;
      div.onclick = () => {
        const details = div.querySelector('.volcano-details');
        details.classList.toggle('hidden');
      };
      sidebar.appendChild(div);
    });

    // Panel SAR
    const sarPanel = document.getElementById('sarPanel');
    sarInterpretations.forEach(layer => {
      const div = document.createElement('div');
      div.className = 'volcano-card';
      div.innerHTML = `
        <b>${layer.title}</b>
        <div class="volcano-details hidden">
          <p><b>Interpretación:</b> ${layer.desc}</p>
          <p><b>Aplicación:</b> ${layer.app}</p>
        </div>
      `;
      div.onclick = () => div.querySelector('.volcano-details').classList.toggle('hidden');
      sarPanel.appendChild(div);
    });

    // Botones
    document.getElementById('toggleVolcanes').onclick = () => {
      sidebar.classList.toggle('hidden');
    };
    document.getElementById('toggleSAR').onclick = () => {
      sarPanel.classList.toggle('hidden');
    };
  </script>

</body>
</html>
